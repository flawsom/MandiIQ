name: Verify R2 backup
description: >
  Downloads an R2 object back to /dev/null to verify it is readable
  after an upload. Emits ::notice:: on success or ::warning:: on failure.
  Does NOT fail the pipeline — the step is always best-effort.

inputs:
  bucket:
    description: "R2 bucket name (e.g. mandiiq-data)."
    required: true
  account-id:
    description: "Cloudflare R2 account ID (24-char hex)."
    required: true
  key:
    description: "Object key to verify."
    required: false
    default: "mandi_iq.duckdb.gz"
  region:
    description: "S3-compatible region. Default 'auto' for R2."
    required: false
    default: "auto"
  aws-access-key-id:
    description: "S3-compatible access key ID (for auth)."
    required: true
  aws-secret-access-key:
    description: "S3-compatible secret access key (for auth)."
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
      run: |
        BUCKET="${{ inputs.bucket }}"
        ACCOUNT_ID="${{ inputs.account-id }}"
        KEY="${{ inputs.key }}"
        REGION="${{ inputs.region }}"
        ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"

        # Only verify if the backup actually completed (metrics file written on success)
        METRICS_FILE="mandi_rdd/data/r2_backup_metrics.json"
        if [ ! -f "$METRICS_FILE" ]; then
          echo "::notice::R2 backup verification skipped — no metrics file found (upload may have failed)"
          exit 0
        fi

        echo "Verifying s3://${BUCKET}/${KEY} at ${ENDPOINT} (region=${REGION}) ..."
        if aws s3 cp "s3://${BUCKET}/${KEY}" /dev/null \
          --endpoint-url "${ENDPOINT}" \
          --region "${REGION}" \
          --only-show-errors; then
          echo "::notice::R2 backup verification passed — ${KEY} is readable"
        else
          echo "::warning::R2 backup verification FAILED — ${KEY} is not readable!"
        fi
