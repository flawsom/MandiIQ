# Automatically notify the API when the Grafana dashboard JSON changes.
#
# When dashboards/mandiiq-pipeline.json is updated on the master branch, this
# workflow compares the pushed file's MD5 against the one production is
# serving and only then POSTs to /webhook/grafana-dashboard-update. That avoids
# needless cache clears (and deploys) for commits that touch the file without
# changing it - a merge conflict resolution, a revert, or a manual dispatch.
#
# If RENDER_DEPLOY_HOOK_URL is set, a matching dashboard also triggers a deploy.
#
# Note: GitHub could not read the name of the previous revision of this file,
# so the workflow never ran. It is kept deliberately conservative here: no
# heredocs, no `${{ }}` inside single-quoted shell JSON, and an explicit
# permissions block.

name: Dashboard Sync

on:
  push:
    branches: [master]
    paths:
      - "dashboards/mandiiq-pipeline.json"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual dashboard cache refresh"

permissions:
  contents: read

env:
  API_BASE: "https://p01--mandiiq--x4n8x4gkmzht.code.run"
  DASHBOARD_FILE: "dashboards/mandiiq-pipeline.json"

jobs:
  check-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      local_hash: ${{ steps.compare.outputs.local_hash }}
      remote_hash: ${{ steps.compare.outputs.remote_hash }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute local MD5 hash
        id: local
        run: |
          if [ -f "${DASHBOARD_FILE}" ]; then
            HASH=$(md5sum "${DASHBOARD_FILE}" | cut -d' ' -f1)
          else
            echo "::error::Dashboard file not found at ${DASHBOARD_FILE}"
            exit 1
          fi
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Local dashboard MD5: ${HASH}"

      - name: Fetch production /admin/dashboard-status
        id: remote
        run: |
          echo "Fetching dashboard status from ${API_BASE}/admin/dashboard-status..."
          HTTP_CODE=$(curl -s -o /tmp/dashboard_status.json -w "%{http_code}" \
            "${API_BASE}/admin/dashboard-status" --max-time 15 || echo "000")
          echo "API responded with HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::warning::Failed to fetch dashboard status (HTTP ${HTTP_CODE})"
            echo "hash=UNKNOWN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REMOTE_HASH=$(python3 -c "import json; print(json.load(open('/tmp/dashboard_status.json'))['md5_hash'])")
          echo "hash=${REMOTE_HASH}" >> "$GITHUB_OUTPUT"
          echo "Remote dashboard MD5: ${REMOTE_HASH}"

      - name: Compare hashes
        id: compare
        run: |
          LOCAL="${{ steps.local.outputs.hash }}"
          REMOTE="${{ steps.remote.outputs.hash }}"
          echo "local_hash=${LOCAL}" >> "$GITHUB_OUTPUT"
          echo "remote_hash=${REMOTE}" >> "$GITHUB_OUTPUT"
          if [ "${REMOTE}" = "UNKNOWN" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "API unreachable - forcing a refresh to be safe."
          elif [ "${LOCAL}" = "${REMOTE}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Hashes match - dashboard unchanged, skipping the webhook."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Hash MISMATCH: local=${LOCAL} remote=${REMOTE}. Refreshing."
          fi

  notify-api:
    needs: check-hash
    if: needs.check-hash.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger dashboard cache webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          LOCAL_HASH: ${{ needs.check-hash.outputs.local_hash }}
          REMOTE_HASH: ${{ needs.check-hash.outputs.remote_hash }}
        run: |
          echo "Triggering dashboard cache refresh at ${API_BASE}/webhook/grafana-dashboard-update ..."
          # Build the payload in a file: interpolating expressions inside a
          # quoted JSON string on the curl line does not survive shell quoting.
          python3 -c "import json, os; json.dump({'event': 'dashboard_updated', 'title': 'MandiIQ Pipeline Dashboard', 'source': 'github-actions', 'trigger': 'dashboard-sync-workflow', 'local_hash': os.environ.get('LOCAL_HASH', ''), 'remote_hash': os.environ.get('REMOTE_HASH', '')}, open('/tmp/webhook_payload.json', 'w'))"
          args=(-s -o /tmp/webhook_response.txt -w "%{http_code}"
                -X POST "${API_BASE}/webhook/grafana-dashboard-update"
                -H "Content-Type: application/json"
                --data-binary @/tmp/webhook_payload.json
                --max-time 15)
          if [ -n "${WEBHOOK_SECRET:-}" ]; then
            args+=(-H "X-Webhook-Secret: ${WEBHOOK_SECRET}")
          fi
          HTTP_CODE=$(curl "${args[@]}" || echo "000")
          echo "API responded with HTTP ${HTTP_CODE}"
          cat /tmp/webhook_response.txt 2>/dev/null || true
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "Dashboard cache refresh succeeded."
          else
            echo "::warning::Webhook returned HTTP ${HTTP_CODE} - the API may be down or unreachable."
          fi

  trigger-render-deploy:
    needs: [check-hash, notify-api]
    if: needs.check-hash.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL || '' }}
        run: |
          if [ -z "${RENDER_HOOK}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set - skipping Render deploy."
            exit 0
          fi
          echo "Sync: triggering Render deploy hook..."
          HTTP_CODE=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" \
            -X POST "${RENDER_HOOK}" --max-time 30 || echo "000")
          echo "Render responded with HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ]; then
            echo "Sync: Render deploy triggered successfully."
          else
            echo "::warning::Sync: Render deploy hook returned HTTP ${HTTP_CODE}"
            cat /tmp/render_response.txt 2>/dev/null || true
          fi
