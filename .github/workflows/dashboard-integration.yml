# Dashboard integration: prove the Streamlit cockpit actually boots and serves.
#
# History worth remembering: this workflow used to fail with
# "Process completed with exit code 7" on every run. The server started fine,
# but the readiness loop ran under `bash -e`, so the very first `curl` -
# executed before the socket was listening - aborted the whole step. The wait
# loop below tolerates failures, reports the server log when it never comes up,
# and only then fails.
#
# Python is pinned to 3.11 because that is what runtime.txt / Streamlit Cloud
# use; running the boot test on a newer interpreter would hide syntax that the
# deployed app cannot parse.

name: Dashboard Integration

on:
  pull_request:
    paths:
      - "mandi_rdd/dashboard/**"
      - "mandi_rdd/styles/**"
      - "mandi_rdd/tests/**"
      - ".github/workflows/dashboard-integration.yml"
  push:
    paths:
      - "mandi_rdd/dashboard/**"
      - "mandi_rdd/styles/**"
      - "mandi_rdd/tests/**"
      - ".github/workflows/dashboard-integration.yml"
  workflow_dispatch:

concurrency:
  group: dashboard-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mandi_rdd

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 (matches runtime.txt)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: mandi_rdd/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Start the Streamlit dashboard
        id: start
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m streamlit run dashboard/app.py \
            --server.port 8502 \
            --server.address 127.0.0.1 \
            --server.headless true \
            --server.fileWatcherType none \
            --browser.gatherUsageStats false \
            > streamlit_stdout.log 2> streamlit_stderr.log &
          echo "Streamlit PID: $!"

          ready=false
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 http://127.0.0.1:8502/ 2>/dev/null || true)
            if [ "${status}" = "200" ]; then
              echo "Dashboard is UP (attempt ${attempt}, HTTP ${status})"
              ready=true
              break
            fi
            echo "  Waiting... attempt ${attempt} (HTTP ${status:-none})"
            sleep 2
          done

          if [ "${ready}" != "true" ]; then
            echo "::error::Streamlit never became ready on 127.0.0.1:8502"
            echo "----- streamlit stderr -----"
            tail -n 100 streamlit_stderr.log 2>/dev/null || true
            echo "----- streamlit stdout -----"
            tail -n 50 streamlit_stdout.log 2>/dev/null || true
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Fetch the app shell
        if: steps.start.outputs.ready == 'true'
        run: |
          curl -s -o /tmp/app_shell.html -w "shell HTTP %{http_code}, %{size_download} bytes\n" \
            --max-time 20 http://127.0.0.1:8502/
          grep -qi "streamlit" /tmp/app_shell.html && echo "App shell served by Streamlit."

      - name: Run dashboard boot + import tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/test_dashboard_boot.py -v --tb=short

      - name: Upload logs and artifacts on failure
        if: failure() || always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: |
            mandi_rdd/streamlit_stderr.log
            mandi_rdd/streamlit_stdout.log
          retention-days: 7
