# Refresh Live Data: keep the production warehouse genuinely current.
#
# The API runs an in-process hourly ingest loop, but a container restart (or a
# crash inside the loop) silently freezes the warehouse - which is exactly how
# the live numbers went stale. This workflow triggers the pipeline from
# outside, waits for it to finish, and fails loudly when the warehouse did not
# advance, so staleness is caught in minutes instead of months.
#
# Overlap safety: the pipeline is serialised by a run lock inside the API, so a
# trigger that lands while another run is in flight reports "busy" instead of
# corrupting the DuckDB file.

name: Refresh Live Data

on:
  schedule:
    - cron: "7 * * * *"   # hourly, offset from the top of the hour
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Minutes to wait for the pipeline to finish"
        required: false
        default: "18"

permissions:
  contents: read

env:
  API_BASE: "https://p01--mandiiq--x4n8x4gkmzht.code.run"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The two failure modes that took production down on 2026-09-30, healed
      # before this workflow tries to ingest into them:
      #
      #   * a recorded index fault (/health.index_fault_pending) means writes
      #     to prices are still dying on an inconsistent ART index;
      #   * an empty warehouse (n_prices == 0) means a rebuild published a
      #     short copy, which is how 1.6M rows disappeared.
      #
      # Both are repairable over HTTP - rebuild the table, or restore the last
      # R2 backup - and neither has an operator watching for it. Anything that
      # cannot be healed fails the job so a human sees it, but the common case
      # now recovers itself on the next hour instead of waiting for one.
      - name: Auto-heal a recorded index fault or an empty warehouse
        env:
          API_BASE: ${{ env.API_BASE }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request

          base = os.environ["API_BASE"].rstrip("/")

          def get(path, timeout=30):
              with urllib.request.urlopen(f"{base}{path}", timeout=timeout) as r:
                  return json.load(r)

          def post(path, timeout=600):
              req = urllib.request.Request(f"{base}{path}", method="POST")
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.load(r)

          try:
              health = get("/health")
          except Exception as e:
              print(f"::warning::/health unreachable ({e}); leaving recovery to the next run")
              raise SystemExit(0)

          if not health.get("safe_recovery"):
              # Older builds rebuild a table non-atomically and decompress the
              # R2 backup in RAM. Pointing recovery at one of those can destroy
              # the warehouse or OOM the container, so it is refused here
              # rather than gambling on the deployed build's behaviour.
              print("::warning::production was not built with safe recovery; "
                    "deploy the current master before automated healing runs")
              raise SystemExit(0)

          problems = []

          if health.get("index_fault_pending"):
              print("index_fault_pending is set - asking the API to rebuild the prices index")
              try:
                  report = post("/admin/rebuild-prices")
                  print("rebuild-prices:", json.dumps(report)[:400])
                  health = get("/health")
                  if health.get("index_fault_pending"):
                      problems.append("the index fault survived a rebuild")
                  else:
                      print("index fault cleared")
              except Exception as e:
                  problems.append(f"rebuild-prices failed: {e}")
              finally:
                  # The API serialises the pipeline behind a run lock; give the
                  # rebuild a moment to release it before /refresh.
                  time.sleep(5)

          n_prices = int(health.get("n_prices") or 0)
          if n_prices == 0:
              print("the warehouse holds no price rows - restoring the last R2 backup")
              try:
                  report = post("/admin/restore-from-r2")
                  print("restore-from-r2:", json.dumps(report)[:400])
                  health = get("/health")
                  n_prices = int(health.get("n_prices") or 0)
                  if n_prices == 0:
                      problems.append("the warehouse is still empty after restoring from R2")
                  else:
                      print(f"warehouse restored: {n_prices} price rows")
              except Exception as e:
                  problems.append(f"restore-from-r2 failed: {e}")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              raise SystemExit(1)

          print(f"warehouse healthy enough to ingest into ({n_prices} price rows)")
          PY

      - name: Trigger the production ingest
        id: trigger
        run: |
          set -u
          health=$(curl -s --max-time 30 "${API_BASE}/health")
          BEFORE=$(echo "${health}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('last_run_utc') or '')")
          RUNNING=$(echo "${health}" | python3 -c "import sys,json; print(str(json.load(sys.stdin).get('ingestion_running', False)).lower())")
          echo "before=${BEFORE}" >> "$GITHUB_OUTPUT"
          echo "Pipeline last ran at: ${BEFORE:-unknown} (running now: ${RUNNING})"

          if [ "${RUNNING}" = "true" ]; then
            echo "::notice::A pipeline run is already in flight; skipping this trigger."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=$(curl -s -o /tmp/refresh.json -w "%{http_code}" \
            -X POST "${API_BASE}/refresh" --max-time 60 || echo "000")
          echo "POST /refresh -> HTTP ${code}"
          cat /tmp/refresh.json || true
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::Could not trigger the production pipeline (HTTP ${code})"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Wait for the pipeline to complete
        if: steps.trigger.outputs.skip == 'false'
        env:
          BEFORE: ${{ steps.trigger.outputs.before }}
          WAIT_MINUTES: ${{ github.event.inputs.wait_minutes || '18' }}
        run: |
          set -u
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            sleep 30
            health=$(curl -s --max-time 30 "${API_BASE}/health")
            AFTER=$(echo "${health}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('last_run_utc') or '')")
            RUNNING=$(echo "${health}" | python3 -c "import sys,json; print(str(json.load(sys.stdin).get('ingestion_running', False)).lower())")
            echo "$(date -u +%H:%M:%S)  last_run=${AFTER:-unknown} running=${RUNNING}"
            if [ -n "${AFTER}" ] && [ "${AFTER}" != "${BEFORE}" ]; then
              echo "::notice::Pipeline completed at ${AFTER}"
              exit 0
            fi
          done
          echo "::error::Pipeline did not report a new run within ${WAIT_MINUTES} minutes."
          exit 1

      - name: Verify the warehouse is fresh
        if: steps.trigger.outputs.skip == 'false'
        run: |
          python3 -m mandi_rdd.scripts.check_production_freshness --api-base "${API_BASE}"

      # Freshness alone is not enough: the pages and routes a visitor uses can
      # break while the warehouse is perfectly current. The same check that
      # runs in consumer-check.yml runs here, so the hourly path that keeps
      # production honest also proves the consumer surface still works.
      - name: Verify every consumer-facing surface still works
        if: steps.trigger.outputs.skip == 'false'
        env:
          PYTHONPATH: .
        run: |
          python3 -m mandi_rdd.scripts.consumer_check --api-base "${API_BASE}" || {
            echo "::error::A consumer-facing page, route or link is broken - see the report above."
            exit 1
          }
