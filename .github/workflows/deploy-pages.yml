name: Deploy SEO to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "mandi_rdd/dashboard/seo.py"
      - "mandi_rdd/dashboard/seo_sitemap.py"
      - "static/**"
      - "docs/**"
      - "landing/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pillow

      - name: Generate sitemaps (best-effort)
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
try:
    from mandi_rdd.dashboard.seo_sitemap import write_sitemaps
    write_sitemaps('static')
    print('Sitemaps generated successfully')
except ImportError as e:
    print(f'Sitemap generation skipped: {e}')
"

      - name: Build og-image if missing
        continue-on-error: true
        run: |
          if [ -f build_og_image.py ]; then
            python build_og_image.py || echo 'og-image build skipped'
          else
            echo 'build_og_image.py not found, skipping'
          fi

      - name: Publish SEO assets to docs/seo
        continue-on-error: true
        run: |
          mkdir -p docs/seo
          for f in og-image.png sitemap-index.xml sitemap-0001.xml robots.txt; do
            if [ -f "static/$f" ]; then
              cp "static/$f" "docs/seo/"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


