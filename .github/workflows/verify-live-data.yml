# MandiIQ — Daily End-to-End Live Data Verification
#
# Runs daily at 08:00 UTC. Checks all 4 production URLs and validates
# the API serves fresh (non-stale) data. Files a GitHub issue if any
# site is unhealthy or data is >48h stale.

name: Verify Live Data

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run live data verification
        id: verify
        continue-on-error: true
        run: |
          python -m mandi_rdd.scripts.verify_live_data \
            --output verify_report.json --timeout 30
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Read verification report
        id: report
        run: |
          if [ -f verify_report.json ]; then
            echo "report<<EOF" >> "$GITHUB_OUTPUT"
            cat verify_report.json >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo 'report={"all_healthy":false}' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: verify_report.json
          retention-days: 7

      - name: Print summary
        run: |
          echo "=== Verification Summary ==="
          python3 -c "
import json
with open('verify_report.json') as f:
    r = json.load(f)
print('Checked: %d sites' % r['n_sites_checked'])
print('Healthy: %d/%d' % (r['n_sites_healthy'], r['n_sites_checked']))
for s in r.get('sites', []):
    print('  [%s] %s (%s)' % ('OK' if s['ok'] else 'FAIL', s['name'], s.get('status','?')))
"

      - name: File GitHub Issue if unhealthy
        if: fromJSON(steps.report.outputs.report).all_healthy == false
        run: |
          REPORT=$(cat verify_report.json)
          CHECKED_AT=$(echo "$REPORT" | python3 -c "import sys,json;print(json.load(sys.stdin).get('checked_at','?'))")
          N_OK=$(echo "$REPORT" | python3 -c "import sys,json;print(json.load(sys.stdin).get('n_sites_healthy',0))")
          N_TOTAL=$(echo "$REPORT" | python3 -c "import sys,json;print(json.load(sys.stdin).get('n_sites_checked',0))")
          TITLE="[Verify] ${N_OK}/${N_TOTAL} sites healthy - ${CHECKED_AT}"

          # Build issue body
          python3 << 'PYEOF'
import json
with open('verify_report.json') as f:
    r = json.load(f)
lines = ["## Live Data Verification Report", "", "**Checked at:** `%s`" % r['checked_at']]
lines.append("**Result:** %d/%d sites healthy" % (r['n_sites_healthy'], r['n_sites_checked']))
lines.append("")
lines.append("| Site | Status | HTTP | Time | Details |")
lines.append("|------|--------|------|------|---------|")
for s in r.get('sites', []):
    icon = "OK" if s['ok'] else "FAIL"
    http = str(s.get('status','?'))
    rt = "%.1fs" % s.get('response_time_s', 0)
    ad = s.get('api_data') or {}
    if ad.get('n_prices') is not None:
        details = "%s prices, %s commodities" % (ad['n_prices'], ad['n_commodities'])
        if s.get('hours_since_last_run') is not None:
            details += ", last_run=%.0fh ago" % s['hours_since_last_run']
    elif s.get('error'):
        details = s['error']
    else:
        details = "-"
    lines.append("| %s | %s | %s | %s | %s |" % (s['name'], icon, http, rt, details))
lines.append("")
if not r.get('all_healthy', True):
    lines.append("### Failed Sites")
    for s in r.get('sites', []):
        if not s['ok']:
            lines.append("- **%s**: %s" % (s['name'], s.get('error','unknown')))
    lines.append("")
    lines.append("### Suggested Actions")
    lines.append("1. Check [Render Dashboard](https://dashboard.render.com)")
    lines.append("2. Check [GitHub Actions](https://github.com/flawsom/MandiIQ/actions)")
    lines.append("3. Verify DNS for custom domains")
lines.append("")
lines.append("---")
lines.append("_Auto-generated by verify-live-data.yml_")
with open('/tmp/issue_body.md', 'w') as f:
    f.write("\n".join(lines))
PYEOF

          EXISTING=$(gh issue list --repo ${{ github.repository }} --label "verify,automated" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Found $EXISTING open issue(s). Skipping - duplicate prevention."
            exit 0
          fi
          gh issue create --repo ${{ github.repository }} --title "$TITLE" --body-file /tmp/issue_body.md --label "verify,automated"
          echo "Issue filed."
