# ── MandiIQ Daily Data Ingestion ──
# Runs every day at 03:00 UTC, fetches fresh satellite + price data,
# and commits the updated NDVI export back to the repo.

name: Ingestion (manual recovery)

# On-demand ingestion only.
#
# This workflow used to fire on every push to master AND on a 06:00 cron while
# nightly-ingest.yml fired on every push and at 05:30 UTC - two full copies of
# the same pipeline racing each other to push the binary DuckDB to master. That
# race is what produced the "rejected - non-fast-forward" failures and the
# interleaved bot commits. The scheduled pipeline now lives in exactly one
# place (nightly-ingest.yml); this file is kept as a manual recovery lever for
# the Actions tab when a nightly run needs redoing.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is ingestion being re-run?"
        required: false
        default: "Manual recovery run"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Same group as nightly-ingest: never two ingestions writing the same
    # DuckDB at once.
    concurrency:
      group: mandiiq-ingest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                     # full history for commit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv           # for .env loading

      - name: Run NDVI pipeline
        env:
          SENTINEL_CLIENT_ID: ${{ secrets.SENTINEL_CLIENT_ID }}
          SENTINEL_CLIENT_SECRET: ${{ secrets.SENTINEL_CLIENT_SECRET }}
          MANDIQ_API_URL: https://p01--mandiiq--x4n8x4gkmzht.code.run
        run: |
          python run_ingest.py

      - name: Commit updated data
        run: |
          git config user.name "flawsom"
          git config user.email "siba@unifies.codes"
          # Exclude DuckDB from commits (it's tracked via LFS and causes conflicts)
          git reset HEAD mandi_rdd/data/mandi_iq.duckdb 2>/dev/null || true
          git add -A
          git reset HEAD mandi_rdd/data/mandi_iq.duckdb 2>/dev/null || true
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: manual data ingest"
            git push --force-with-lease origin master
          fi
