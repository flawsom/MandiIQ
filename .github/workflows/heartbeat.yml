name: Heartbeat

# GitHub disables scheduled workflows after 60 days with no repository activity.
# During a sustained zero-new-rows data lull, the daily-ingest job skips its
# commit (no DB change), so the repo could go inactive and the cron would be
# silently disabled. This weekly heartbeat keeps the repo "active" so the
# daily ingestion schedule survives legitimate data gaps (PRD Phase 9).

on:
  schedule:
    - cron: '17 3 * * 1'     # Weekly repo heartbeat: Monday 03:17 UTC (keeps GH cron alive)
  workflow_dispatch:

jobs:
  heartbeat:
    # Only run the repo-write heartbeat on the weekly cron or manual dispatch,
    # NOT on the every-10-min keep-alive schedule.
    if: github.event.schedule == '17 3 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Touch heartbeat marker
        run: |
          git config user.name "mandiiq-bot"
          git config user.email "bot@mandiiq.local"
          echo "$(date -u)" > last_heartbeat.txt
          git add last_heartbeat.txt
          git commit -m "chore: weekly heartbeat" || echo "nothing to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:master || echo "push skipped"

  # Keep-alive pings: free-tier hosts spin down after inactivity, so the first
  # visitor of the day would otherwise pay a cold start (or find a sleeping
  # service). The continuous pinger lives in keepalive.yml (every 10 minutes);
  # this weekly pass is the belt-and-braces version and still works if GitHub
  # disabled the frequent schedule after a long period of repo inactivity.
  #
  # These URLs are public production endpoints, so no secrets are required -
  # the old job silently did nothing because its RENDER_API_URL /
  # STREAMLIT_APP_URL secrets were never set.
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping production endpoints
        env:
          API_BASE: "https://p01--mandiiq--x4n8x4gkmzht.code.run"
          MIRROR_BASE: "https://p01--mandiiq--zbvjrztgjqgw.code.run"
          LANDING_URL: "https://mandiiq.unifies.codes"
          STREAMLIT_URL: "https://mandiiq.streamlit.app"
        run: |
          failures=0
          for target in "${API_BASE}/health" "${MIRROR_BASE}/health" "${LANDING_URL}" "${STREAMLIT_URL}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 25 --retry 2 --retry-delay 5 --retry-all-errors \
              "$target" 2>/dev/null || echo "000")
            echo "HTTP ${code}  ${target}"
            if [ "${code}" != "200" ] && [ "${code}" != "303" ]; then
              failures=$(( failures + 1 ))
            fi
          done
          if [ "${failures}" -gt 0 ]; then
            echo "::warning::${failures} keep-alive request(s) failed - a service may be asleep or down."
          fi
