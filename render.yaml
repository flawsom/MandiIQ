# Render Blueprints config for the MandiIQ FastAPI server.
# Deploy: https://dashboard.render.com/blueprints â†’ "New Blueprint Instance"
# Connect the flawsom/MandiIQ repo. Render reads this file automatically.
#
# REQUIRED dashboard env vars (set manually in Render dashboard, not in this file):
#   DATA_GOV_IN_API_KEY   â€” free key from https://api.data.gov.in/
#   GEMINI_API_KEY        â€” Google Gemini API key
#   NVIDIA_API_KEY        â€” NVIDIA NIM API key (for DeepSeek V4 Pro)
#   OPENROUTER_API_KEY    â€” OpenRouter API key (optional alternative)

services:
  - type: web
    name: mandiiq-api
    runtime: python
    plan: free
    region: oregon
    branch: master
    buildCommand: |
      # Fetch the DuckDB from Git LFS before the app starts
      git lfs install
      git lfs pull --include 'mandi_rdd/data/mandi_iq.duckdb' --exclude=''
      pip install -r requirements/api.txt
    startCommand: uvicorn mandi_rdd.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MANDIIQ_DB_PATH
        value: mandi_rdd/data/mandi_iq.duckdb
      - key: PORT
        value: "8000"
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # Grafana -- self-hosted observability sidecar
  # Scrapes /metrics from mandiiq-api via internal DNS.
  # Requires Render plan with Docker support (Starter $7/mo+).
  - type: web
    name: grafana
    runtime: docker
    dockerfilePath: ./grafana/Dockerfile
    plan: starter
    region: oregon
    branch: master
    disk:
      name: grafana-data
      mountPath: /var/lib/grafana
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GF_SECURITY_ADMIN_PASSWORD
        generateValue: true
      # GF_SERVER_ROOT_URL is auto-detected by Render via RENDER_EXTERNAL_URL
      - key: GF_AUTH_ANONYMOUS_ENABLED
        value: 'true'
      - key: GF_AUTH_ANONYMOUS_ORG_ROLE
        value: Viewer
