<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 920" width="460" height="920" role="img" aria-label="MandiIQ landing page on a phone: headline finding, call to action and live counters">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#050505"/><stop offset="100%" stop-color="#0b0d07"/>
    </linearGradient>
    <radialGradient id="m-glow" cx="70%" cy="6%" r="70%">
      <stop offset="0%" stop-color="#d7ff00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d7ff00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m-cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d7ff00"/><stop offset="100%" stop-color="#a9cc00"/>
    </linearGradient>
    <pattern id="m-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
  </defs>

  <g font-family="Inter, Segoe UI, system-ui, sans-serif">
    <!-- device -->
    <rect x="20.5" y="20.5" width="419" height="879" rx="46" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.4"/>
    <rect x="30" y="30" width="400" height="860" rx="38" fill="url(#m-bg)"/>
    <rect x="30" y="30" width="400" height="860" rx="38" fill="url(#m-dots)"/>
    <rect x="30" y="30" width="400" height="860" rx="38" fill="url(#m-glow)"/>
    <rect x="182" y="42" width="96" height="22" rx="11" fill="#000000" stroke="#ffffff" stroke-opacity="0.10"/>

    <!-- status bar -->
    <text x="66" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#8a8a8a">9:41</text>
    <g fill="#8a8a8a">
      <rect x="330" y="64" width="3" height="9" rx="1"/><rect x="336" y="61" width="3" height="12" rx="1"/>
      <rect x="342" y="58" width="3" height="15" rx="1"/><rect x="352" y="60" width="18" height="11" rx="3" fill="none" stroke="#8a8a8a" stroke-opacity="0.6"/>
      <rect x="354" y="62" width="11" height="7" rx="2" fill="#8a8a8a" fill-opacity="0.7"/>
    </g>

    <!-- nav -->
    <rect x="58" y="100" width="18" height="18" rx="5" fill="#d7ff00" fill-opacity="0.16" stroke="#d7ff00" stroke-opacity="0.5"/>
    <path d="M61.5 111 L66 105.4 L70.5 111" fill="none" stroke="#d7ff00" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="86" y="115" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="16.5" font-weight="600" fill="#ffffff">MandiIQ</text>
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.6">
      <line x1="386" y1="106" x2="406" y2="106"/><line x1="386" y1="112" x2="406" y2="112"/>
    </g>

    <!-- live pill -->
    <g>
      <rect x="58" y="140" width="196" height="30" rx="15" fill="#2ecc71" fill-opacity="0.10" stroke="#2ecc71" stroke-opacity="0.30"/>
      <circle cx="76" cy="155" r="4.2" fill="#2ecc71"/>
      <text x="90" y="160" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#2ecc71">live warehouse &#183; /health</text>
    </g>

    <!-- headline -->
    <text x="58" y="212" font-size="11" fill="#7e7e7e" letter-spacing="2.2">01 / CAUSAL DISCONTINUITY</text>
    <text x="58" y="252" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Rainfall crosses</text>
    <text x="58" y="290" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#d7ff00">&#8722;19%</text>
    <text x="58" y="326" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#ffffff">onion prices show</text>
    <text x="58" y="358" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#ffffff">no jump (p = 0.28)</text>

    <text x="58" y="396" font-size="14.5" fill="#bababa">Causal inference, forecasting and procurement</text>
    <text x="58" y="418" font-size="14.5" fill="#bababa">advice on India&#8217;s mandi prices &#8212; and the</text>
    <text x="58" y="440" font-size="14.5" fill="#bababa">robustness checks that cut against the finding.</text>

    <!-- CTAs -->
    <rect x="58" y="468" width="200" height="46" rx="12" fill="url(#m-cta)"/>
    <text x="76" y="497" font-size="14.5" font-weight="600" fill="#0a0a0a">Launch MandiIQ &#8594;</text>
    <rect x="270" y="468" width="132" height="46" rx="12" fill="transparent" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="286" y="497" font-size="13.5" fill="#bababa">Live console</text>

    <!-- chips -->
    <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5">
      <g>
        <rect x="58" y="534" width="140" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="72" y="551" fill="#9a9a9a">Regression disc.</text>
      </g>
      <g>
        <rect x="206" y="534" width="88" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="220" y="551" fill="#9a9a9a">DuckDB</text>
      </g>
      <g>
        <rect x="302" y="534" width="100" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="316" y="551" fill="#9a9a9a">FastAPI</text>
      </g>
    </g>

    <!-- counters -->
    <rect x="58" y="582" width="344" height="112" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
    <g font-family="IBM Plex Mono, ui-monospace, monospace">
      <text x="78" y="610" font-size="21" font-weight="600" fill="#ffffff">1.99M</text>
      <text x="78" y="630" font-size="10.5" fill="#7e7e7e">PRICE ROWS</text>
      <text x="200" y="610" font-size="21" font-weight="600" fill="#ffffff">423</text>
      <text x="200" y="630" font-size="10.5" fill="#7e7e7e">COMMODITIES</text>
      <text x="300" y="610" font-size="21" font-weight="600" fill="#ffffff">36</text>
      <text x="300" y="630" font-size="10.5" fill="#7e7e7e">STATES</text>
      <line x1="78" y1="646" x2="382" y2="646" stroke="#ffffff" stroke-opacity="0.07"/>
      <text x="78" y="670" font-size="11.5" fill="#7e7e7e">14 years of arrivals &#183; 667 districts &#183; IMD rainfall joined</text>
    </g>

    <!-- second card: robustness -->
    <rect x="58" y="712" width="344" height="104" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#f39c12" stroke-opacity="0.22"/>
    <text x="78" y="740" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="14" fill="#ffffff">Statistical robustness</text>
    <text x="78" y="764" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#f39c12">0 / 30 specifications significant</text>
    <text x="78" y="784" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#9a9a9a">bandwidth sweep null &#183; 0 FDR survivors</text>
    <text x="78" y="802" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#9a9a9a">placebo at &#8722;37% spurious (+&#8377;297)</text>

    <!-- tab bar -->
    <rect x="30" y="828" width="400" height="62" rx="0" fill="#ffffff" fill-opacity="0.03"/>
    <line x1="30" y1="828" x2="430" y2="828" stroke="#ffffff" stroke-opacity="0.08"/>
    <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" text-anchor="middle">
      <text x="90" y="864" fill="#d7ff00">Overview</text>
      <text x="180" y="864" fill="#7e7e7e">Findings</text>
      <text x="266" y="864" fill="#7e7e7e">Console</text>
      <text x="360" y="864" fill="#7e7e7e">API</text>
    </g>
    <g fill="#7e7e7e">
      <circle cx="90" cy="846" r="3.2" fill="#d7ff00"/><circle cx="180" cy="846" r="3.2"/>
      <circle cx="266" cy="846" r="3.2"/><circle cx="360" cy="846" r="3.2"/>
    </g>
  </g>
</svg>
