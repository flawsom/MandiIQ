<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" role="img" aria-label="MandiIQ Streamlit cockpit: executive overview with warehouse counters, price chart, discontinuity plot and procurement advisory">
  <defs>
    <linearGradient id="k-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070707"/><stop offset="100%" stop-color="#0c0b06"/>
    </linearGradient>
    <linearGradient id="k-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="k-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7ff00" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d7ff00" stop-opacity="0"/>
    </linearGradient>
    <pattern id="k-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <g font-family="Inter, Segoe UI, system-ui, sans-serif">
    <rect x="0.5" y="0.5" width="1399" height="879" rx="20" fill="url(#k-bg)" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="0.5" y="0.5" width="1399" height="879" rx="20" fill="url(#k-dots)"/>

    <!-- chrome -->
    <rect x="0.5" y="0.5" width="1399" height="52" rx="20" fill="#ffffff" fill-opacity="0.02"/>
    <rect x="0.5" y="32" width="1399" height="21" fill="#ffffff" fill-opacity="0.02"/>
    <circle cx="34" cy="27" r="5.5" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="56" cy="27" r="5.5" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="78" cy="27" r="5.5" fill="#ffffff" fill-opacity="0.09"/>
    <rect x="112" y="12" width="360" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="130" y="32" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" fill="#bababa">mandiiq.streamlit.app</text>
    <rect x="1218" y="12" width="147" height="30" rx="15" fill="#d7ff00" fill-opacity="0.10" stroke="#d7ff00" stroke-opacity="0.32"/>
    <text x="1236" y="32" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#d7ff00">Streamlit cockpit</text>
    <line x1="0" y1="53" x2="1400" y2="53" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- sidebar -->
    <rect x="0.5" y="53" width="300" height="826" fill="url(#k-side)"/>
    <line x1="300" y1="53" x2="300" y2="880" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="26" y="80" width="18" height="18" rx="5" fill="#d7ff00" fill-opacity="0.16" stroke="#d7ff00" stroke-opacity="0.5"/>
    <path d="M29.5 91 L34 85.4 L38.5 91" fill="none" stroke="#d7ff00" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="56" y="95" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff">MandiIQ</text>
    <text x="26" y="122" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#555" letter-spacing="1.5">COCKPIT / 15 PAGES</text>
    <g font-size="14">
      <rect x="14" y="136" width="272" height="34" rx="9" fill="#d7ff00" fill-opacity="0.10" stroke="#d7ff00" stroke-opacity="0.28"/>
      <text x="30" y="158" fill="#d7ff00">Executive overview</text>
      <text x="30" y="192" fill="#9a9a9a">Discontinuity</text>
      <text x="30" y="222" fill="#9a9a9a">Causal explorer</text>
      <text x="30" y="252" fill="#9a9a9a">Forecast</text>
      <text x="30" y="282" fill="#9a9a9a">Risk forecast</text>
      <text x="30" y="312" fill="#9a9a9a">Risk map</text>
      <text x="30" y="342" fill="#9a9a9a">Satellite</text>
      <text x="30" y="372" fill="#9a9a9a">Procurement advisor</text>
      <text x="30" y="402" fill="#9a9a9a">Discount simulator</text>
      <text x="30" y="432" fill="#9a9a9a">Analyst lab</text>
      <text x="30" y="462" fill="#9a9a9a">Deep dive</text>
      <text x="30" y="492" fill="#9a9a9a">Ask MandiIQ</text>
    </g>
    <line x1="26" y1="516" x2="274" y2="516" stroke="#ffffff" stroke-opacity="0.07"/>
    <g font-size="14" fill="#6f6f6f">
      <text x="30" y="546">Settings</text>
      <text x="30" y="576">About</text>
      <text x="30" y="606">Onboarding</text>
    </g>
    <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5">
      <rect x="26" y="796" width="248" height="54" rx="11" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="42" y="818" fill="#7e7e7e">WAREHOUSE</text>
      <text x="42" y="838" fill="#2ecc71">responsive /health poll</text>
    </g>

    <!-- main header -->
    <text x="336" y="96" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Executive overview</text>
    <text x="336" y="120" font-size="13.5" fill="#7e7e7e">Commodity: Onion &#183; every figure below is read from the live warehouse, not a fixture</text>
    <rect x="1128" y="80" width="238" height="44" rx="12" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="1148" y="100" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#7e7e7e">DATA THROUGH</text>
    <text x="1148" y="117" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#ffffff">2026-09-25 &#183; 6d behind</text>

    <!-- metric tiles -->
    <g font-family="IBM Plex Mono, ui-monospace, monospace">
      <g>
        <rect x="336" y="144" width="245" height="92" rx="13" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="356" y="168" font-size="11" fill="#7e7e7e" letter-spacing="1.2">PRICE RECORDS</text>
        <text x="356" y="200" font-size="25" font-weight="600" fill="#ffffff">1,994,318</text>
        <text x="356" y="220" font-size="11" fill="#555">upserts are idempotent</text>
      </g>
      <g>
        <rect x="597" y="144" width="245" height="92" rx="13" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="617" y="168" font-size="11" fill="#7e7e7e" letter-spacing="1.2">COMMODITIES</text>
        <text x="617" y="200" font-size="25" font-weight="600" fill="#ffffff">423</text>
        <text x="617" y="220" font-size="11" fill="#555">36 states &#183; 667 districts</text>
      </g>
      <g>
        <rect x="858" y="144" width="245" height="92" rx="13" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
        <text x="878" y="168" font-size="11" fill="#7e7e7e" letter-spacing="1.2">RAINFALL ROWS</text>
        <text x="878" y="200" font-size="25" font-weight="600" fill="#ffffff">2,278</text>
        <text x="878" y="220" font-size="11" fill="#555">1,056 below the threshold</text>
      </g>
      <g>
        <rect x="1119" y="144" width="245" height="92" rx="13" fill="#ffffff" fill-opacity="0.035" stroke="#2ecc71" stroke-opacity="0.26"/>
        <text x="1139" y="168" font-size="11" fill="#7e7e7e" letter-spacing="1.2">DATE INTEGRITY</text>
        <text x="1139" y="200" font-size="25" font-weight="600" fill="#ffffff">clean</text>
        <text x="1139" y="220" font-size="11" fill="#555">future arrivals rejected</text>
      </g>
    </g>

    <!-- price chart -->
    <g>
      <rect x="336" y="258" width="700" height="292" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="358" y="288" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="15" fill="#ffffff">Onion &#183; modal price, median per session</text>
      <g stroke="#ffffff" stroke-opacity="0.06">
        <line x1="336" y1="352" x2="1036" y2="352"/>
        <line x1="336" y1="404" x2="1036" y2="404"/>
        <line x1="336" y1="456" x2="1036" y2="456"/>
        <line x1="336" y1="508" x2="1036" y2="508"/>
      </g>
      <path fill="url(#k-area)" d="M336 470 L392 452 L448 462 L504 430 L560 442 L616 406 L672 418 L728 388 L784 400 L840 366 L896 380 L952 350 L1008 362 L1036 342 L1036 508 L336 508 Z"/>
      <path fill="none" stroke="#d7ff00" stroke-width="2.4" stroke-linejoin="round" d="M336 470 L392 452 L448 462 L504 430 L560 442 L616 406 L672 418 L728 388 L784 400 L840 366 L896 380 L952 350 L1008 362 L1036 342"/>
      <line x1="336" y1="508" x2="1036" y2="508" stroke="#ffffff" stroke-opacity="0.16"/>
      <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#555">
        <text x="358" y="530">daily sessions, newest last</text>
        <text x="900" y="530">GET /prices</text>
      </g>
    </g>

    <!-- discontinuity + advisor -->
    <g>
      <rect x="1052" y="258" width="312" height="292" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="1074" y="288" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="15" fill="#ffffff">Discontinuity at &#8722;19%</text>
      <line x1="1208" y1="316" x2="1208" y2="486" stroke="#d9663b" stroke-width="1.5" stroke-dasharray="5 5"/>
      <g fill="#d7ff00">
        <circle cx="1092" cy="436" r="4.6" fill-opacity="0.85"/><circle cx="1112" cy="424" r="5.2" fill-opacity="0.85"/>
        <circle cx="1136" cy="412" r="4.2" fill-opacity="0.85"/><circle cx="1164" cy="400" r="5.4" fill-opacity="0.85"/>
        <circle cx="1190" cy="392" r="4.4" fill-opacity="0.85"/>
      </g>
      <g fill="#7bb8ff">
        <circle cx="1228" cy="378" r="4.8" fill-opacity="0.8"/><circle cx="1252" cy="388" r="5.4" fill-opacity="0.8"/>
        <circle cx="1276" cy="398" r="4.2" fill-opacity="0.8"/><circle cx="1300" cy="410" r="5" fill-opacity="0.8"/>
        <circle cx="1326" cy="424" r="4.6" fill-opacity="0.8"/>
      </g>
      <path d="M1084 442 L1198 388" stroke="#d7ff00" stroke-width="1.9" fill="none"/>
      <path d="M1218 376 L1338 432" stroke="#7bb8ff" stroke-width="1.9" fill="none"/>
      <text x="1074" y="500" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#7e7e7e">bandwidth &#177;15&#8211;30pp</text>
      <rect x="1074" y="512" width="268" height="26" rx="13" fill="#f39c12" fill-opacity="0.10" stroke="#f39c12" stroke-opacity="0.28"/>
      <text x="1088" y="529" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#f39c12">null in every window (p 0.42&#8230;0.27)</text>
    </g>

    <!-- advisor + ask -->
    <g>
      <rect x="336" y="570" width="1028" height="232" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="358" y="600" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="15" fill="#ffffff">Procurement advisor &#183; recommendation with its own uncertainty</text>
      <g font-family="IBM Plex Mono, ui-monospace, monospace">
        <g>
          <rect x="358" y="618" width="318" height="76" rx="11" fill="#d7ff00" fill-opacity="0.05" stroke="#d7ff00" stroke-opacity="0.22"/>
          <text x="374" y="642" font-size="10.5" fill="#7e7e7e" letter-spacing="1.1">ACTION</text>
          <text x="374" y="666" font-size="18" fill="#ffffff">buy / hold / delay</text>
          <text x="374" y="684" font-size="10.5" fill="#555">GET /recommendation/{commodity}</text>
        </g>
        <g>
          <rect x="692" y="618" width="318" height="76" rx="11" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="708" y="642" font-size="10.5" fill="#7e7e7e" letter-spacing="1.1">SPIKE RISK</text>
          <text x="708" y="666" font-size="18" fill="#ffffff">probability</text>
          <text x="708" y="684" font-size="10.5" fill="#555">GET /risk-score/{commodity}</text>
        </g>
        <g>
          <rect x="1026" y="618" width="318" height="76" rx="11" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="1042" y="642" font-size="10.5" fill="#7e7e7e" letter-spacing="1.1">ASK MANDIIQ</text>
          <text x="1042" y="666" font-size="18" fill="#ffffff">plain English</text>
          <text x="1042" y="684" font-size="10.5" fill="#555">POST /ask &#183; routed across models</text>
        </g>
      </g>
      <line x1="358" y1="712" x2="1342" y2="712" stroke="#ffffff" stroke-opacity="0.07"/>
      <text x="358" y="740" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#7e7e7e">Forecast MAPE (Prophet, winning horizon) 11.2% &#183; spike classifier ROC-AUC 0.81 &#183; conformal coverage reported per commodity</text>
      <text x="358" y="766" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#555">Model metrics are printed with their evaluation context on the page, and the dashboard labels when a table is too thin to fit.</text>
    </g>

    <text x="336" y="852" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#555">Interface preview of the Streamlit cockpit &#183; 20 modules, 15 navigable pages &#183; counters measured from /health, 2026-10-01 &#183; chart shape is illustrative</text>
  </g>
</svg>
